databaseChangeLog:
  - changeSet:
      id: "3003260001"
      author: system
      comment: "T04/T15: Add fields to test_cases for SP/Function/Trigger verification (case_name, setup_script, invocation_query, verification_type, input_parameters, match_type)"
      changes:
        - addColumn:
            tableName: test_cases
            columns:
              - column:
                  name: case_name
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: setup_script
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: invocation_query
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: verification_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: true
              - column:
                  name: input_parameters
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: match_type
                  type: VARCHAR(16)
                  defaultValue: EXACT
                  constraints:
                    nullable: true

  - changeSet:
      id: "3003260002"
      author: system
      comment: "T04/T15: Backfill match_type for existing test_cases rows"
      changes:
        - sql:
            sql: UPDATE test_cases SET match_type = 'EXACT' WHERE match_type IS NULL

  - changeSet:
      id: "3003260003"
      author: system
      comment: "P1-1: Allow validation_query to be NULL for PRINT_OUTPUT verification type (where capture is via SQLWarning chain, not result set)"
      changes:
        - dropNotNullConstraint:
            tableName: test_cases
            columnName: validation_query
            columnDataType: TEXT

  # T16: Mark exam results that contain SP/FN/Trigger questions for regrade.
  # The new pipeline (T01–T14) changes how those question types are graded, so
  # any score given before this changelog runs is no longer trustworthy.
  #
  # Strategy: do NOT delete the old score; instead flip status back to PENDING
  # and reset submission status so the existing GradingWorker picks them up
  # and re-runs the new pipeline. The teacher/student gets notified per the
  # standard grading-completed flow.
  #
  # NOTE: this assumes the GradingWorker is configured to scan PENDING results
  # and re-enqueue them on startup. If not, an ops engineer must manually
  # trigger a /regrade-all endpoint after this migration runs.
  - changeSet:
      id: "3003260010"
      author: system
      comment: "T16: Reset status to PENDING for exam_results that contain SP/FN/Trigger questions"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE exam_results
              SET status = 'PENDING'
              WHERE status = 'COMPLETED'
                AND exam_id IN (
                  SELECT DISTINCT exam_id
                  FROM exam_questions
                  WHERE question_type IN ('STORED_PROCEDURE', 'FUNCTION', 'TRIGGER')
                );

  - changeSet:
      id: "3003260011"
      author: system
      comment: "T16: Reset submissions of regraded results to PENDING so worker re-runs them"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE exam_submissions
              SET status = 'PENDING'
              WHERE (exam_id, student_id, attempt_number) IN (
                SELECT exam_id, student_id, attempt_number
                FROM exam_results
                WHERE status = 'PENDING'
                  AND exam_id IN (
                    SELECT DISTINCT exam_id
                    FROM exam_questions
                    WHERE question_type IN ('STORED_PROCEDURE', 'FUNCTION', 'TRIGGER')
                  )
              );

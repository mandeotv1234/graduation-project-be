                    (1, N'SKU-101', N'Ống thép mạ kẽm', N'Kim loại', 180000),
                    (2, N'SKU-102', N'Kính cường lực', N'Vật liệu hoàn thiện', 560000),
                    (3, N'SKU-103', N'Dây cáp điện', N'Điện', 120000);

spring:
  application:
    name: graduation-project-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  liquibase:
    change-log: classpath:db/changelog/grad-changelog-master.yaml
  data:
    redis:
      repositories:
        enabled: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
app:
  upload:
    pdf-dir: ${APP_UPLOAD_PDF_DIR:uploads/exams/pdf}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${MAIL_FROM_NAME:Ứng dụng Hỗ trợ Giảng dạy và Đánh giá Học phần Cơ sở Dữ liệu}

grading:
  worker:
    enabled: ${GRADING_WORKER_ENABLED:true}
    concurrency: ${GRADING_WORKER_CONCURRENCY:1}
    max-jobs-per-cycle: ${GRADING_MAX_JOBS_PER_CYCLE:3}
    stale-timeout-seconds: ${GRADING_STALE_TIMEOUT_SECONDS:1800}
    auto-scale-enabled: ${GRADING_WORKER_AUTO_SCALE_ENABLED:false}
    min-concurrency: ${GRADING_WORKER_MIN_CONCURRENCY:0}
    max-concurrency: ${GRADING_WORKER_MAX_CONCURRENCY:0}
    scale-up-queue-threshold: ${GRADING_WORKER_SCALE_UP_QUEUE_THRESHOLD:10}
    scale-down-queue-threshold: ${GRADING_WORKER_SCALE_DOWN_QUEUE_THRESHOLD:2}
    scale-down-idle-cycles: ${GRADING_WORKER_SCALE_DOWN_IDLE_CYCLES:6}

exam:
  auto-submit-worker:
    enabled: ${AUTO_SUBMIT_WORKER_ENABLED:true}
  heartbeat-sweep:
    enabled: ${HEARTBEAT_SWEEP_ENABLED:true}

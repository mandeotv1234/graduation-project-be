name: CI/CD - Build & Deploy to Elastic Beanstalk (Java)

on:
  push:
    branches:
      - '**'

env:
  JAR_PATH: build/libs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-build-

      - name: Grant execute for gradlew
        run: chmod +x ./gradlew

      - name: Build bootJar
        run: ./gradlew clean bootJar --no-daemon

      - name: Find built JAR
        id: findjar
        run: |
          echo "Looking for jar in $JAR_PATH"
          ls -la $JAR_PATH
          JARFILE=$(ls $JAR_PATH/*.jar | head -n 1 || true)
          if [ -z "$JARFILE" ]; then
            echo "No JAR found!"
            exit 1
          fi
          echo "jarfile=$JARFILE" >> $GITHUB_OUTPUT

      # Only configure AWS credentials on develop
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/develop'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload JAR to S3
        id: upload_s3
        if: github.ref == 'refs/heads/develop'
        run: |
          JARFILE=${{ steps.findjar.outputs.jarfile }}
          KEY=${{ github.sha }}-app.jar
          echo "Uploading $JARFILE to s3://${{ secrets.EB_S3_BUCKET }}/$KEY"
          aws s3 cp "$JARFILE" "s3://${{ secrets.EB_S3_BUCKET }}/$KEY"
          echo "s3_key=$KEY" >> $GITHUB_OUTPUT

      - name: Create Elastic Beanstalk application version
        id: create_version
        if: github.ref == 'refs/heads/develop'
        run: |
          APP=${{ secrets.EB_APP_NAME }}
          BUCKET=${{ secrets.EB_S3_BUCKET }}
          KEY=${{ steps.upload_s3.outputs.s3_key }}
          VERSION_LABEL=${{ github.run_number }}-${{ github.sha }}
          echo "Creating application version $VERSION_LABEL for $APP from s3://$BUCKET/$KEY"
          aws elasticbeanstalk create-application-version \
            --application-name "$APP" \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="$BUCKET",S3Key="$KEY" \
            --auto-create-application
          echo "version_label=$VERSION_LABEL" >> $GITHUB_OUTPUT

      - name: Deploy to Elastic Beanstalk
        if: github.ref == 'refs/heads/develop'
        run: |
          ENV_NAME=${{ secrets.EB_ENV_NAME }}
          APP=${{ secrets.EB_APP_NAME }}
          VERSION_LABEL=${{ steps.create_version.outputs.version_label }}
          echo "Updating environment $ENV_NAME to version $VERSION_LABEL"
          aws elasticbeanstalk update-environment \
            --environment-name "$ENV_NAME" \
            --version-label "$VERSION_LABEL"

      - name: Wait for environment update
        if: github.ref == 'refs/heads/develop'
        run: |
          ENV_NAME=${{ secrets.EB_ENV_NAME }}
          echo "Waiting for environment to be in Ready/Green..."
          aws elasticbeanstalk wait environment-updated --environment-name "$ENV_NAME"

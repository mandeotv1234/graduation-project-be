databaseChangeLog:
  - changeSet:
      id: 0903260901
      author: manhuynh
      changes:
        - createTable:
            tableName: exam_violations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: exam_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: violation_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: exam_violations
            baseColumnNames: exam_id
            referencedTableName: exams
            referencedColumnNames: id
            constraintName: fk_violation_exam
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: exam_violations
            baseColumnNames: student_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_violation_student
            onDelete: CASCADE
            onUpdate: CASCADE
        - sql:
            sql: >
              ALTER TABLE exam_violations ADD CONSTRAINT chk_violation_type
              CHECK (violation_type IN (
                'TAB_SWITCHED',
                'WINDOW_LOST_FOCUS',
                'ILLEGAL_PASTE',
                'ILLEGAL_COPY',
                'FULLSCREEN_EXIT',
                'DEVTOOLS_OPENED',
                'RIGHT_CLICK',
                'SUSPICIOUS_ACTIVITY'
              ))
        - createIndex:
            tableName: exam_violations
            indexName: idx_violation_exam_student
            columns:
              - column:
                  name: exam_id
              - column:
                  name: student_id


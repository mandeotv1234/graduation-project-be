<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
<meta charset="UTF-8"/>
<style>
@page {
  size: A4;
  margin: 1.5cm 1.6cm 1.7cm 1.6cm;
  @top-left {
    content: counter(page);
    font-family: "Liberation Serif", serif;
    background-color: #4f7fb8;
    color: #fff;
    font-size: 11pt;
    width: 2.2cm;
    height: 14pt;
    line-height: 14pt;
    padding-right: 5pt;
    box-sizing: border-box;
    text-align: right;
    vertical-align: top;
  }
}
body {
  font-family: "Liberation Serif", serif;
  font-size: 11pt;
  color: #000;
  line-height: 1.35;
}
h1.exam-title {
  font-size: 18pt;
  font-weight: bold;
  text-align: center;
  color: #1f3f68;
  border-bottom: 1pt solid #4f7fb8;
  margin: 0 0 8pt 0;
  padding-bottom: 4pt;
}
.student-row {
  display: table;
  width: 100%;
  margin: 9pt 0 10pt 0;
}
.student-cell {
  display: table-cell;
  width: 50%;
}
.student-label {
  font-weight: bold;
  display: inline;
}
.dotted-line {
  border-bottom: 1pt dotted #000;
  display: inline-block;
  width: 60%;
  vertical-align: bottom;
}
h2.section-title {
  font-size: 12pt;
  font-weight: bold;
  margin: 13pt 0 6pt 0;
  text-transform: uppercase;
}
.regulations-block {
  white-space: pre-wrap;
  font-size: 10.5pt;
  margin: 0 0 8pt 0;
}
/* Entity / dataset table */
.entities-container:after {
  content: "";
  display: block;
  clear: both;
}
.entity-block {
  float: left;
  width: 48.5%;
  page-break-inside: avoid;
  margin-bottom: 10pt;
}
.entity-left {
  clear: left;
  margin-right: 3%;
}
.entity-right {
  margin-right: 0;
}
.entity-heading {
  background-color: #dbe6f3;
  border: 1pt solid #888;
  padding: 2pt 5pt;
  text-align: left;
}
.entity-code {
  font-weight: bold;
  font-size: 17pt;
  line-height: 1;
}
.entity-caption {
  font-size: 8.5pt;
  font-weight: normal;
  margin-left: 4pt;
}
.entity-description {
  font-size: 10.5pt;
  line-height: 1.25;
  padding: 4pt 5pt;
  text-align: justify;
}
table.entity-table, table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 10pt;
}
table.entity-table th, table.data-table th {
  background-color: #c6d8ec;
  border: 1pt solid #555;
  padding: 2pt 5pt;
  text-align: left;
  font-weight: bold;
}
table.entity-table td, table.data-table td {
  border: 1pt solid #888;
  padding: 2pt 5pt;
}
.pk-cell {
  font-weight: bold;
}
/* Questions section */
ol.questions-list {
  margin: 0;
  padding-left: 20pt;
}
ol.questions-list > li {
  margin-bottom: 8pt;
  page-break-inside: avoid;
}
.question-points {
  font-weight: bold;
}
.question-content {
  display: inline;
}
/* Dataset section */
.dataset-block {
  page-break-inside: avoid;
  margin-bottom: 14pt;
}
.dataset-table-name {
  font-weight: bold;
  font-size: 11pt;
  margin-bottom: 3pt;
}
/* Footer */
.exam-footer {
  text-align: center;
  margin-top: 24pt;
  font-weight: bold;
  font-size: 12pt;
}
/* Note line under questions */
.note-line {
  font-style: italic;
  margin-top: 8pt;
  font-size: 10.5pt;
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<h1 class="exam-title" th:text="${examTitle}">Đề thi môn Cơ sở dữ liệu</h1>

<!-- ===== MSSV / HỌ TÊN ===== -->
<div class="student-row">
  <div class="student-cell">
    <span class="student-label">MSSV: </span><span class="dotted-line">&#160;</span>
  </div>
  <div class="student-cell">
    <span class="student-label">Họ tên: </span><span class="dotted-line">&#160;</span>
  </div>
</div>

<!-- ===== QUY ĐỊNH ===== -->
<div th:if="${regulations != null and !#strings.isEmpty(regulations)}">
  <h2 class="section-title">Quy định :</h2>
  <div class="regulations-block" th:text="${regulations}"></div>
</div>

<!-- ===== MÔ TẢ CƠ SỞ DỮ LIỆU ===== -->
<div th:if="${entities != null and !entities.isEmpty()}">
  <h2 class="section-title">Mô tả cơ sở dữ liệu :</h2>

  <div class="entities-container">
  <div th:each="entity, iter : ${entities}"
       class="entity-block"
       th:classappend="${iter.index % 2 == 0 ? 'entity-left' : 'entity-right'}">
    <table class="entity-table">
      <thead>
        <tr>
          <th colspan="2" class="entity-heading">
            <span class="entity-code" th:text="${entity.entityName}">ENTITY</span>
            <span class="entity-caption"
                  th:if="${entity.displayName != null and !#strings.isEmpty(entity.displayName)}"
                  th:text="${entity.displayName}">Tên hiển thị</span>
          </th>
        </tr>
        <tr>
          <th>Thuộc tính</th>
          <th>Mô tả</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="attr : ${entity.attributes}">
          <td th:class="${attr.primaryKey ? 'pk-cell' : ''}" th:text="${attr.attributeName}">col</td>
          <td th:text="${attr.description != null ? attr.description : ''}"></td>
        </tr>
        <tr th:if="${entity.description != null and !#strings.isEmpty(entity.description)}">
          <td colspan="2" class="entity-description" th:text="${entity.description}">Tân từ</td>
        </tr>
      </tbody>
    </table>
  </div>
  </div>
</div>

<!-- ===== YÊU CẦU ===== -->
<div th:if="${questions != null and !questions.isEmpty()}">
  <h2 class="section-title">Yêu cầu :</h2>
  <ol class="questions-list">
    <li th:each="q, iter : ${questions}">
      <span class="question-points" th:text="|(${q.formattedPoints}đ)|"></span>&#160;<span class="question-content" th:utext="${q.sanitizedContent}">Nội dung câu hỏi</span>
    </li>
  </ol>
  <p class="note-line" th:if="${questionNote != null}" th:text="${questionNote}"></p>
</div>

<!-- ===== DỮ LIỆU MẪU ===== -->
<div th:if="${dataTables != null and !dataTables.isEmpty()}">
  <h2 class="section-title">Dữ liệu mẫu :</h2>

  <div th:each="dataTable : ${dataTables}" class="dataset-block">
    <div class="dataset-table-name" th:text="${dataTable.tableName}">TABLE_NAME</div>
    <table class="data-table">
      <thead>
        <tr>
          <th th:each="col : ${dataTable.columns}" th:text="${col}">col</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${dataTable.rows}">
          <td th:each="cell : ${row}" th:text="${cell}">val</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ===== HẾT ===== -->
<div class="exam-footer">--- HẾT ---</div>

</body>
</html>

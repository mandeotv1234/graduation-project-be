                  QLCM VARCHAR(10),
                  FOREIGN KEY (PhongBan) REFERENCES PhongBan(MaPB)
              );

              ALTER TABLE PhongBan
              ADD CONSTRAINT FK_TruongPhong FOREIGN KEY (TruongPhong) REFERENCES NhanVien(MaNV);


databaseChangeLog:
  - changeSet:
      id: 2905261611
      author: manhuynh
      comment: "GRAD-167: Create class_student_bans table for exam ban feature"
      changes:
        - createTable:
            tableName: class_student_bans
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: class_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_class_student_bans_class
                    references: classes(id)
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_class_student_bans_student
                    references: users(id)
              - column:
                  name: reason
                  type: TEXT
              - column:
                  name: banned_by
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_class_student_bans_banned_by
                    references: users(id)
              - column:
                  name: banned_at
                  type: TIMESTAMP
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: |
              CREATE UNIQUE INDEX uq_active_class_student_ban ON class_student_bans (class_id, student_id) WHERE active = true;
        - sql:
            dbms: postgresql
            sql: |
              CREATE INDEX idx_class_student_bans_class_active ON class_student_bans (class_id, active);

                    SET IDENTITY_INSERT [order_items] OFF;
                    $DATA1$,
                    '[{"tableName":"customers","columns":["id","fullName","email","city"],"rows":[["1","Nguyễn An","an.nguyen@example.com","Hồ Chí Minh"],["2","Trần Bình","binh.tran@example.com","Hà Nội"],["3","Lê Cường","cuong.le@example.com","Đà Nẵng"],["4","Phạm Dung","dung.pham@example.com","Cần Thơ"]]},{"tableName":"warehouses","columns":["id","name","region"],"rows":[["1","Kho Thủ Đức","Miền Nam"],["2","Kho Long Biên","Miền Bắc"],["3","Kho Đà Nẵng","Miền Trung"]]},{"tableName":"products","columns":["id","sku","productName","category","unitPrice"],"rows":[["1","SKU-001","Xi măng PCB40","Vật liệu thô","95000"],["2","SKU-002","Sắt phi 16","Kim loại","210000"],["3","SKU-003","Gạch block","Vật liệu hoàn thiện","8500"],["4","SKU-004","Sơn ngoại thất","Hóa chất","320000"]]},{"tableName":"orders","columns":["id","customerId","warehouseId","orderDate","status"],"rows":[["1","1","1","2026-01-05T08:00:00","PAID"],["2","2","2","2026-01-06T10:15:00","SHIPPED"],["3","3","3","2026-01-07T14:20:00","PAID"],["4","4","1","2026-01-08T16:00:00","PROCESSING"]]},{"tableName":"order_items","columns":["id","orderId","productId","quantity","unitPrice"],"rows":[["1","1","1","30","95000"],["2","1","3","200","8500"],["3","2","2","12","210000"],["4","3","4","8","320000"],["5","4","1","15","95000"],["6","4","2","10","210000"]]}]',
                    1,
                    true,

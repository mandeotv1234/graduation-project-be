  - changeSet:
      id: 1003100901
      author: manhuynh
      comment: "Create teacher_notifications table for fraud notification persistence"
      changes:
        - createTable:
            tableName: teacher_notifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: exam_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: student_name
                  type: VARCHAR(255)
              - column:
                  name: violation_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: violation_count
                  type: BIGINT
                  defaultValueNumeric: 0
              - column:
                  name: auto_submitted
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: teacher_notifications
            baseColumnNames: teacher_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notification_teacher
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: teacher_notifications
            baseColumnNames: exam_id
            referencedTableName: exams
            referencedColumnNames: id
            constraintName: fk_notification_exam
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: teacher_notifications
            baseColumnNames: student_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notification_student
            onDelete: CASCADE
            onUpdate: CASCADE
        - createIndex:
            tableName: teacher_notifications
            indexName: idx_notification_teacher_created
            columns:
              - column:
                  name: teacher_id
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            tableName: teacher_notifications
            indexName: idx_notification_teacher_read
            columns:
              - column:
                  name: teacher_id
              - column:
                  name: is_read

  - changeSet:
      id: 1003260001
      author: manhuynh
      comment: "Make template_id nullable in exams table — templateId is now optional"
      changes:
        - dropForeignKeyConstraint:
            baseTableName: exams
            constraintName: fk_exam_template
        - modifyDataType:
            tableName: exams
            columnName: template_id
            newDataType: BIGINT
        - sql:
            sql: ALTER TABLE exams ALTER COLUMN template_id DROP NOT NULL
        - addForeignKeyConstraint:
            baseTableName: exams
            baseColumnNames: template_id
            referencedTableName: schema_templates
            referencedColumnNames: id
            constraintName: fk_exam_template
            onDelete: SET NULL
            onUpdate: CASCADE

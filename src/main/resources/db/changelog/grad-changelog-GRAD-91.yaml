                RETURNING id INTO v_entity_tuyenxe_id;

                INSERT INTO spec_entities (specification_id, entity_name, display_name, description, order_index)
                VALUES (v_spec_id, 'Xe', 'Xe', 'Thong tin xe', 2)
                RETURNING id INTO v_entity_xe_id;

                INSERT INTO spec_entities (specification_id, entity_name, display_name, description, order_index)
                VALUES (v_spec_id, 'PhongBan', 'PhongBan', 'Thong tin phong ban', 3)
                RETURNING id INTO v_entity_phongban_id;

                INSERT INTO spec_entities (specification_id, entity_name, display_name, description, order_index)
                VALUES (v_spec_id, 'NhanVien', 'NhanVien', 'Thong tin nhan vien', 4)
                RETURNING id INTO v_entity_nhanvien_id;

                INSERT INTO spec_entities (specification_id, entity_name, display_name, description, order_index)
                VALUES (v_spec_id, 'ChuyenXe', 'ChuyenXe', 'Thong tin chuyen xe', 5)
                RETURNING id INTO v_entity_chuyenxe_id;

                INSERT INTO spec_entities (specification_id, entity_name, display_name, description, order_index)
                VALUES (v_spec_id, 'PhanCong', 'PhanCong', 'Phan cong nhan vien cho chuyen xe', 6)
                RETURNING id INTO v_entity_phancong_id;

                -- ====================================================
                -- Step 7: Insert spec_attributes for each entity
                -- ====================================================

                -- TuyenXe attributes
                INSERT INTO spec_attributes (entity_id, attribute_name, data_type, description, is_primary_key, is_nullable, order_index)
                VALUES
                (v_entity_tuyenxe_id, 'MaTuyen', 'VARCHAR(10)', 'Ma tuyen xe', TRUE, FALSE, 1),
                (v_entity_tuyenxe_id, 'BenDi', 'NVARCHAR(100)', 'Ben di', FALSE, TRUE, 2),
                (v_entity_tuyenxe_id, 'BenDen', 'NVARCHAR(100)', 'Ben den', FALSE, TRUE, 3),
                (v_entity_tuyenxe_id, 'UocLuongThoiGian', 'INT', 'Uoc luong thoi gian (phut)', FALSE, TRUE, 4);


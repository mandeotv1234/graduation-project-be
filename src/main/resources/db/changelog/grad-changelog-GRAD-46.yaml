databaseChangeLog:
  - changeSet:
      id: 1203260001
      author: manhuynh
      comment: "GRAD-46: Create exam_specifications table (1-1 with exams)"
      changes:
        - createTable:
            tableName: exam_specifications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: exam_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: exam_specifications
            baseColumnNames: exam_id
            referencedTableName: exams
            referencedColumnNames: id
            constraintName: fk_spec_exam
            onDelete: CASCADE
            onUpdate: CASCADE

  - changeSet:
      id: 1203260002
      author: manhuynh
      comment: "GRAD-46: Create spec_entities table (e.g. PHIM, GIAITHUONG)"
      changes:
        - createTable:
            tableName: spec_entities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: specification_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: entity_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(100)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: order_index
                  type: INT
                  defaultValueNumeric: 0
        - addForeignKeyConstraint:
            baseTableName: spec_entities
            baseColumnNames: specification_id
            referencedTableName: exam_specifications
            referencedColumnNames: id
            constraintName: fk_spec_entity_spec
            onDelete: CASCADE
            onUpdate: CASCADE

  - changeSet:
      id: 1203260003
      author: manhuynh
      comment: "GRAD-46: Create spec_attributes table (columns of each entity)"
      changes:
        - createTable:
            tableName: spec_attributes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: entity_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: attribute_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: data_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(255)
              - column:
                  name: is_primary_key
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: is_nullable
                  type: BOOLEAN
                  defaultValueBoolean: true
              - column:
                  name: order_index
                  type: INT
                  defaultValueNumeric: 0
        - addForeignKeyConstraint:
            baseTableName: spec_attributes
            baseColumnNames: entity_id
            referencedTableName: spec_entities
            referencedColumnNames: id
            constraintName: fk_spec_attr_entity
            onDelete: CASCADE
            onUpdate: CASCADE
        - createIndex:
            tableName: spec_attributes
            indexName: idx_spec_attr_entity
            columns:
              - column:
                  name: entity_id

  # ===== SEED DATA: Đặc tả bài thi 1 — Quản lý xe =====

  - changeSet:
      id: 1203260004
      author: manhuynh
      comment: "GRAD-46: Insert exam_specification for exam 1 (Quản lý xe)"
      changes:
        - insert:
            tableName: exam_specifications
            columns:
              - column:
                  name: exam_id
                  valueNumeric: 1
              - column:
                  name: title
                  value: "Cơ sở dữ liệu Quản lý Xe"
              - column:
                  name: description
                  value: "Đặc tả schema cơ sở dữ liệu dùng trong bài thi quản lý xe. Sinh viên cần viết các câu truy vấn SQL để thao tác trên các bảng XE, LOAIXE, KHACHHANG và PHIEUTHUE."

  - changeSet:
      id: 1203260005
      author: manhuynh
      comment: "GRAD-46: Insert spec_entities for exam 1 (4 entities: XE, LOAIXE, KHACHHANG, PHIEUTHUE)"
      changes:
        - insert:
            tableName: spec_entities
            columns:
              - column:
                  name: specification_id
                  valueNumeric: 1
              - column:
                  name: entity_name
                  value: "Xe"
              - column:
                  name: display_name
                  value: "XE"
              - column:
                  name: description
                  value: "Mỗi xe có một mã xe duy nhất, thuộc một loại xe, có biển số và giá thuê theo ngày. Một xe có thể được thuê nhiều lần bởi các khách hàng khác nhau."
              - column:
                  name: order_index
                  valueNumeric: 1
        - insert:
            tableName: spec_entities
            columns:
              - column:
                  name: specification_id
                  valueNumeric: 1
              - column:
                  name: entity_name
                  value: "LoaiXe"
              - column:
                  name: display_name
                  value: "LOAIXE"
              - column:
                  name: description
                  value: "Phân loại xe theo nhóm (sedan, SUV, tải, ...). Mỗi loại xe có mã loại duy nhất và tên loại duy nhất."
              - column:
                  name: order_index
                  valueNumeric: 2
        - insert:
            tableName: spec_entities
            columns:
              - column:
                  name: specification_id
                  valueNumeric: 1
              - column:
                  name: entity_name
                  value: "KhachHang"
              - column:
                  name: display_name
                  value: "KHACHHANG"
              - column:
                  name: description
                  value: "Khách hàng đăng ký thuê xe. Mỗi khách hàng có mã khách duy nhất, họ tên, số điện thoại và địa chỉ. Số điện thoại là duy nhất trong hệ thống."
              - column:
                  name: order_index
                  valueNumeric: 3
        - insert:
            tableName: spec_entities
            columns:
              - column:
                  name: specification_id
                  valueNumeric: 1
              - column:
                  name: entity_name
                  value: "PhieuThue"
              - column:
                  name: display_name
                  value: "PHIEUTHUE"
              - column:
                  name: description
                  value: "Ghi nhận mỗi lượt thuê xe của khách hàng. Một phiếu thuê gắn với một xe và một khách hàng, có ngày thuê, ngày trả và tổng tiền. Ngày trả có thể chưa có nếu xe chưa được hoàn trả."
              - column:
                  name: order_index
                  valueNumeric: 4


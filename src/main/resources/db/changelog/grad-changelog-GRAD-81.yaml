                  );
                END IF;

                IF NOT EXISTS (
                  SELECT 1 FROM spec_datasets
                  WHERE specification_id = v_spec_id AND name = 'Dataset Stress'
                ) THEN
                  INSERT INTO spec_datasets (
                    specification_id, name, data_script, table_data, order_index, is_active, created_at, updated_at
                  ) VALUES (

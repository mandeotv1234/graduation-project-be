databaseChangeLog:
  - changeSet:
      id: 2103260003
      author: manhuynh
      changes:
        - addColumn:
            tableName: exam_results
            columns:
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: COMPLETED
                  constraints:
                    nullable: true
      comment: >
        Add status column to exam_results table to support async grading.
        Values: PENDING, GRADING, COMPLETED, FAILED.
        Default is COMPLETED for backward compatibility with existing records.

  - changeSet:
      id: 2103260004
      author: manhuynh
      changes:
        - sql:
            sql: ALTER TABLE exam_submissions DROP CONSTRAINT IF EXISTS chk_sub_status
        - sql:
            sql: ALTER TABLE exam_submissions ADD CONSTRAINT chk_sub_status CHECK (status IN ('PENDING', 'GRADED'))
      comment: >
        Update exam_submissions status constraint to allow PENDING and GRADED values
        (instead of IN_PROGRESS and SUBMITTED) to match the SubmissionStatus enum.

  - changeSet:
      id: 2103260005
      author: manhuynh
      changes:
        - sql:
            sql: ALTER TABLE exam_submissions ALTER COLUMN status SET DEFAULT 'PENDING'
      comment: >
        Update default value of status column in exam_submissions from IN_PROGRESS to PENDING

  - changeSet:
      id: 2103260006
      author: manhuynh
      changes:
        - sql:
            sql: UPDATE exam_submissions SET status = 'PENDING' WHERE status = 'IN_PROGRESS'
        - sql:
            sql: UPDATE exam_submissions SET status = 'GRADED' WHERE status = 'SUBMITTED'
      comment: >
        Migrate existing status values from IN_PROGRESS/SUBMITTED to PENDING/GRADED
  - changeSet:
      id: 2203261700
      author: manhuynh
      comment: "GRAD-68: Create test_cases table"
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: test_cases
      changes:
        - createTable:
            tableName: test_cases
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: question_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: validation_query
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: expected_value
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: score_weight
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: order_index
                  type: INT
                  defaultValueNumeric: 1
        - addForeignKeyConstraint:
            baseTableName: test_cases
            baseColumnNames: question_id
            referencedTableName: exam_questions
            referencedColumnNames: id
            constraintName: fk_test_cases_exam_question
            onDelete: CASCADE
            onUpdate: CASCADE

  - changeSet:
      id: 2203261701
      author: manhuynh
      comment: "GRAD-68: Populate test cases for mock exam"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                v_exam_id BIGINT;
                v_spec_id BIGINT;
                v_q1_id BIGINT;
                v_q2_id BIGINT;
              BEGIN
                SELECT id, specification_id INTO v_exam_id, v_spec_id FROM exams WHERE title = 'De 1010 - Mon Co so du lieu' LIMIT 1;
                IF v_exam_id IS NOT NULL THEN
                  SELECT id INTO v_q1_id FROM exam_questions WHERE exam_id = v_exam_id AND order_index = 1;
                  SELECT id INTO v_q2_id FROM exam_questions WHERE exam_id = v_exam_id AND order_index = 2;

                  IF v_q1_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM test_cases WHERE question_id = v_q1_id) THEN
                    INSERT INTO test_cases (question_id, validation_query, expected_value, score_weight, order_index) VALUES
                    (v_q1_id, 'SELECT CAST(COUNT(*) AS NVARCHAR(50)) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = ''{SCHEMA}'' AND TABLE_NAME = ''CONGTY''', '1', 0.50, 1),
                    (v_q1_id, 'SELECT CAST(COUNT(*) AS NVARCHAR(50)) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = ''{SCHEMA}'' AND TABLE_NAME = ''CONGTRINH''', '1', 0.50, 2),
                    (v_q1_id, 'SELECT CAST(COUNT(*) AS NVARCHAR(50)) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = ''{SCHEMA}'' AND TABLE_NAME = ''HANGMUC''', '1', 0.50, 3),
                    (v_q1_id, 'SELECT CAST(COUNT(*) AS NVARCHAR(50)) FROM sys.foreign_keys fk JOIN sys.tables tp ON fk.parent_object_id = tp.object_id JOIN sys.tables tr ON fk.referenced_object_id = tr.object_id JOIN sys.schemas s ON tp.schema_id = s.schema_id WHERE s.name = ''{SCHEMA}'' AND tp.name = ''CONGTRINH'' AND tr.name = ''CONGTY''', '1', 0.50, 4),
                    (v_q1_id, 'SELECT CAST(COUNT(*) AS NVARCHAR(50)) FROM sys.foreign_keys fk JOIN sys.tables tp ON fk.parent_object_id = tp.object_id JOIN sys.tables tr ON fk.referenced_object_id = tr.object_id JOIN sys.schemas s ON tp.schema_id = s.schema_id WHERE s.name = ''{SCHEMA}'' AND tp.name = ''HANGMUC'' AND tr.name = ''CONGTRINH''', '1', 0.50, 5);
                  END IF;

                  IF v_q2_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM test_cases WHERE question_id = v_q2_id) THEN
                    INSERT INTO test_cases (question_id, validation_query, expected_value, score_weight, order_index) VALUES
                    (v_q2_id, 'SELECT CAST( (SELECT COUNT(*) FROM (SELECT * FROM [{SCHEMA}].CONGTY EXCEPT SELECT * FROM [{TEACHER_SCHEMA}].CONGTY) a) + (SELECT COUNT(*) FROM (SELECT * FROM [{TEACHER_SCHEMA}].CONGTY EXCEPT SELECT * FROM [{SCHEMA}].CONGTY) b) AS NVARCHAR(50) )', '0', 0.50, 1),
                    (v_q2_id, 'SELECT CAST( (SELECT COUNT(*) FROM (SELECT * FROM [{SCHEMA}].CONGTRINH EXCEPT SELECT * FROM [{TEACHER_SCHEMA}].CONGTRINH) a) + (SELECT COUNT(*) FROM (SELECT * FROM [{TEACHER_SCHEMA}].CONGTRINH EXCEPT SELECT * FROM [{SCHEMA}].CONGTRINH) b) AS NVARCHAR(50) )', '0', 0.50, 2),
                    (v_q2_id, 'SELECT CAST( (SELECT COUNT(*) FROM (SELECT * FROM [{SCHEMA}].HANGMUC EXCEPT SELECT * FROM [{TEACHER_SCHEMA}].HANGMUC) a) + (SELECT COUNT(*) FROM (SELECT * FROM [{TEACHER_SCHEMA}].HANGMUC EXCEPT SELECT * FROM [{SCHEMA}].HANGMUC) b) AS NVARCHAR(50) )', '0', 1.00, 3);
                  END IF;

                  -- Cập nhật để DDL Script luôn chứa data INSERT gốc vì teacherSchemaName chỉ setup từ ddlScript
                  UPDATE specifications
                  SET ddl_script = CONCAT(ddl_script, CHR(10), (
                      SELECT data_script 
                      FROM spec_datasets 
                      WHERE specification_id = v_spec_id 
                      ORDER BY order_index LIMIT 1
                  ))
                  WHERE id = v_spec_id AND ddl_script NOT LIKE '%INSERT INTO CONGTY%';

                  -- Cập nhật data_script của dataset test để xoá cữ liệu đi (tránh duplicate PK) trước khi insert testcase dataset
                  UPDATE spec_datasets
                  SET data_script = CONCAT('DELETE FROM HANGMUC; DELETE FROM CONGTRINH; DELETE FROM CONGTY; ', CHR(10), data_script)
                  WHERE specification_id = v_spec_id 
                    AND name <> 'Default Dataset' 
                    AND data_script NOT LIKE '%DELETE FROM HANGMUC%';
                END IF;
              END $$;

  - changeSet:
      id: 2203261702
      author: manhuynh
      comment: "GRAD-68: Update exam 1010 details and questions to Vietnamese"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                v_exam_id BIGINT;
              BEGIN
                SELECT id INTO v_exam_id FROM exams WHERE title = 'De 1010 - Mon Co so du lieu' LIMIT 1;
                IF v_exam_id IS NOT NULL THEN
                  -- Update exam details: status, dates, attempts, and class
                  UPDATE exams
                  SET is_published = TRUE,
                      start_time = TIMESTAMP '2026-03-22 00:00:00.000',
                      end_time = TIMESTAMP '2026-03-30 23:59:59.000',
                      max_attempts = 99,
                      class_id = 1
                  WHERE id = v_exam_id;

                  -- Update questions content to Vietnamese with accents
                  UPDATE exam_questions SET content = 'Câu 1 (2.50đ): Tạo bảng và các ràng buộc cần thiết cho CONGTY, CONGTRINH, HANGMUC.' WHERE exam_id = v_exam_id AND order_index = 1;
                  UPDATE exam_questions SET content = 'Câu 2 (2.00đ): Nhập dữ liệu theo đề bài vào các bảng tương ứng.' WHERE exam_id = v_exam_id AND order_index = 2;
                  UPDATE exam_questions SET content = 'Câu 3 (1.50đ): Tính tổng chi phí và tổng số nhân công của công trình "Trung tâm thương mại CoCo".' WHERE exam_id = v_exam_id AND order_index = 3;
                  UPDATE exam_questions SET content = 'Câu 4 (2.00đ): Danh sách tên công ty, trụ sở và tên công trình tiêu biểu của các công ty Việt Nam.' WHERE exam_id = v_exam_id AND order_index = 4;
                  UPDATE exam_questions SET content = 'Câu 5 (2.00đ): Với mỗi công trình được xây trước năm hiện hành và thuộc công ty có công trình tiêu biểu kết thúc bởi "ABC Buildings", cho biết tên công trình và tổng chi phí.' WHERE exam_id = v_exam_id AND order_index = 5;
                END IF;
              END $$;

  - changeSet:
      id: 2203261703
      author: manhuynh
      comment: "GRAD-68: Cập nhật lại query đúng của đề thi 1010 (xóa bỏ ORDER BY vì đề không yêu cầu sort)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                v_exam_id BIGINT;
              BEGIN
                SELECT id INTO v_exam_id FROM exams WHERE title = 'De 1010 - Mon Co so du lieu' LIMIT 1;
                IF v_exam_id IS NOT NULL THEN
                  UPDATE exam_questions 
                  SET correct_query = REPLACE(correct_query, 'ORDER BY c.TenCT', '') 
                  WHERE exam_id = v_exam_id AND order_index = 4;

                  UPDATE exam_questions 
                  SET correct_query = REPLACE(correct_query, 'ORDER BY ct.TenCongTrinh', '') 
                  WHERE exam_id = v_exam_id AND order_index = 5;
                END IF;
              END $$;

  - changeSet:
      id: 2203261704
      author: manhuynh
      comment: "GRAD-68: Cập nhật lại ddl_script của Đề 1010 để khớp với đáp án thực thực tế (FLOAT vs DECIMAL)"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              UPDATE specifications
              SET ddl_script = '-- 1. Tạo bảng CONGTY
              CREATE TABLE CONGTY (
                  MaCT VARCHAR(5) PRIMARY KEY,
                  TenCT NVARCHAR(50),
                  QuocGia NVARCHAR(50),
                  TruSo NVARCHAR(50),
                  CongTrinhTB VARCHAR(5)
              );
              
              -- 2. Tạo bảng CONGTRINH
              CREATE TABLE CONGTRINH (
                  MaCongTrinh VARCHAR(5),
                  MaCongTy VARCHAR(5),
                  TenCongTrinh NVARCHAR(100),
                  Nam INT DEFAULT YEAR(GETDATE()) CHECK (Nam <= YEAR(GETDATE())),
                  DiaDiem NVARCHAR(100),
                  PRIMARY KEY (MaCongTrinh, MaCongTy),
                  FOREIGN KEY (MaCongTy) REFERENCES CONGTY(MaCT)
              );
              
              -- 3. Thêm ràng buộc khóa ngoại cho bảng CONGTY
              ALTER TABLE CONGTY
              ADD CONSTRAINT FK_CONGTY_CONGTRINH 
              FOREIGN KEY (CongTrinhTB, MaCT) REFERENCES CONGTRINH(MaCongTrinh, MaCongTy);
              
              -- 4. Tạo bảng HANGMUC
              CREATE TABLE HANGMUC (
                  STT INT,
                  MaCongTrinh VARCHAR(5),
                  MaCongTy VARCHAR(5),
                  TenHangMuc NVARCHAR(100),
                  ChiPhi FLOAT,
                  NhanCong INT,
                  PRIMARY KEY (STT, MaCongTrinh, MaCongTy),
                  FOREIGN KEY (MaCongTrinh, MaCongTy) REFERENCES CONGTRINH(MaCongTrinh, MaCongTy)
              );
              ' || CHR(10) || (SELECT data_script FROM spec_datasets WHERE specification_id = specifications.id ORDER BY order_index LIMIT 1)
              WHERE name LIKE 'Quản Lý Công Ty Xây Dựng%';

  - changeSet:
      id: 2203261705
      author: manhuynh
      comment: "GRAD-68: Add 3 advanced format questions (TRIGGER, STORED_PROCEDURE, FUNCTION) to De 1010 to test algorithmic grading"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                v_exam_id BIGINT;
                v_q6_id BIGINT;
                v_q7_id BIGINT;
                v_q8_id BIGINT;
              BEGIN
                SELECT id INTO v_exam_id FROM exams WHERE title = 'De 1010 - Mon Co so du lieu' LIMIT 1;
                IF v_exam_id IS NOT NULL THEN
                  -- Xoá test cũ nếu chạy lại
                  DELETE FROM exam_questions WHERE exam_id = v_exam_id AND order_index IN (6,7,8);
                  
                  -- CÂU 6: TRIGGER
                  INSERT INTO exam_questions (exam_id, content, question_type, correct_query, verify_script, points, order_index)
                  VALUES (
                    v_exam_id,
                    'Câu 6 (1.00 điểm): Tạo TRIGGER tên trg_CheckNhanCong gắn vào bảng HANGMUC. Nếu người dùng INSERT hoặc UPDATE mà có số NhanCong < 0 thì tự động hủy giao dịch (ROLLBACK TRANSACTION).',
                    'TRIGGER',
                    'CREATE TRIGGER trg_CheckNhanCong ON HANGMUC FOR INSERT, UPDATE AS BEGIN IF EXISTS (SELECT * FROM inserted WHERE NhanCong < 0) BEGIN ROLLBACK TRANSACTION; END END',
                    '', 1.00, 6
                  ) RETURNING id INTO v_q6_id;

                  -- CÂU 7: STORED_PROCEDURE
                  INSERT INTO exam_questions (exam_id, content, question_type, correct_query, verify_script, points, order_index)
                  VALUES (
                    v_exam_id,
                    'Câu 7 (1.00 điểm): Tạo STORED PROCEDURE tên sp_TangChiPhi nhận vào 3 tham số: @MaCT VARCHAR(5), @MaCongTrinh VARCHAR(5), @Tien FLOAT. Thủ tục cộng dồn @Tien vào cột ChiPhi của bảng HANGMUC.',
                    'STORED_PROCEDURE',
                    'CREATE PROCEDURE sp_TangChiPhi @MaCT VARCHAR(5), @MaCongTrinh VARCHAR(5), @Tien FLOAT AS BEGIN UPDATE HANGMUC SET ChiPhi = ChiPhi + @Tien WHERE MaCongTy = @MaCT AND MaCongTrinh = @MaCongTrinh; END',
                    '', 1.00, 7
                  ) RETURNING id INTO v_q7_id;

                  -- CÂU 8: FUNCTION
                  INSERT INTO exam_questions (exam_id, content, question_type, correct_query, verify_script, points, order_index)
                  VALUES (
                    v_exam_id,
                    'Câu 8 (1.00 điểm): Tạo FUNCTION tên fn_TongNhanCong nhận vào tham số @MaCT VARCHAR(5), trả về tổng số công nhân (kiểu INT) làm việc cho công ty đó trong mọi hạng mục. Trả về 0 nếu không có hạng mục nào.',
                    'FUNCTION',
                    'CREATE FUNCTION fn_TongNhanCong (@MaCT VARCHAR(5)) RETURNS INT AS BEGIN DECLARE @Tong INT; SELECT @Tong = ISNULL(SUM(NhanCong), 0) FROM HANGMUC WHERE MaCongTy = @MaCT; RETURN @Tong; END',
                    '', 1.00, 8
                  ) RETURNING id INTO v_q8_id;

                  -- INSERT Test Cases
                  INSERT INTO test_cases (question_id, validation_query, expected_value, score_weight, order_index) VALUES
                  -- Test TRIGGER
                  (v_q6_id, 'BEGIN TRY INSERT INTO {SCHEMA}.HANGMUC (STT, MaCongTrinh, MaCongTy, TenHangMuc, ChiPhi, NhanCong) VALUES(99, ''001'', ''CTY01'', ''Test Ngang'', 10, -5); SELECT CAST(1 AS INT); END TRY BEGIN CATCH SELECT CAST(0 AS INT); END CATCH', '0', 0.50, 1),
                  (v_q6_id, 'BEGIN TRY UPDATE {SCHEMA}.HANGMUC SET NhanCong = -1 WHERE STT=1; SELECT CAST(1 AS INT); END TRY BEGIN CATCH SELECT CAST(0 AS INT); END CATCH', '0', 0.50, 2),
                  
                  -- Test PROCEDURE: Tự kiểm tra logic đúng hay sai bằng cách so sánh trước và sau khi thực thi SP. Trả về 1 nếu đúng, 0 nếu sai.
                  (v_q7_id, 'DECLARE @OldSum DECIMAL(12,2) = ISNULL((SELECT SUM(ChiPhi) FROM {SCHEMA}.HANGMUC WHERE MaCongTy=''CTY01'' AND MaCongTrinh=''001''), 0); DECLARE @RowCount INT = (SELECT COUNT(*) FROM {SCHEMA}.HANGMUC WHERE MaCongTy=''CTY01'' AND MaCongTrinh=''001''); EXEC {SCHEMA}.sp_TangChiPhi ''CTY01'', ''001'', 50; DECLARE @NewSum DECIMAL(12,2) = ISNULL((SELECT SUM(ChiPhi) FROM {SCHEMA}.HANGMUC WHERE MaCongTy=''CTY01'' AND MaCongTrinh=''001''), 0); SELECT CASE WHEN @NewSum = @OldSum + (@RowCount * 50.0) THEN CAST(1 AS INT) ELSE CAST(0 AS INT) END;', '1', 1.00, 1),

                  -- Test FUNCTION
                  (v_q8_id, 'SELECT {SCHEMA}.fn_TongNhanCong(''CTY01'')', 'SELECT ISNULL(SUM(NhanCong), 0) FROM {TEACHER_SCHEMA}.HANGMUC WHERE MaCongTy=''CTY01''', 0.50, 1),
                  (v_q8_id, 'SELECT {SCHEMA}.fn_TongNhanCong(''CTY99'')', '0', 0.50, 2);
                  
                  -- Cập nhật data testcase
                  UPDATE test_cases SET expected_value = '180' WHERE question_id = v_q8_id AND order_index = 1;
                END IF;
              END $$;

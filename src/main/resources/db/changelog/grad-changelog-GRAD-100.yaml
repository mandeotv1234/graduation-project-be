databaseChangeLog:
  - changeSet:
      id: 090420260001
      author: phanphuc
      changes:
        - addColumn:
            tableName: exam_questions
            columns:
              - column:
                  name: rule_cards_schema
                  type: TEXT
                  constraints:
                    nullable: true
  - changeSet:
      id: 090420260002
      author: phanphuc
      changes:
        - addColumn:
            tableName: specifications
            columns:
              - column:
                  name: schema_diagram
                  type: TEXT
                  constraints:
                    nullable: true
  - changeSet:
      id: 090420260003
      author: phanphuc
      changes:
        - createTable:
            tableName: rule_presets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: teacher_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rule_presets_teacher
                    references: users(id)
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: question_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: rules_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

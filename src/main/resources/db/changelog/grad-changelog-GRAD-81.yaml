                    SET IDENTITY_INSERT [products] ON;
                    INSERT INTO [products] ([id], [sku], [productName], [category], [unitPrice]) VALUES
                    (1, N'SKU-001', N'Xi măng PCB40', N'Vật liệu thô', 95000),
                    (2, N'SKU-002', N'Sắt phi 16', N'Kim loại', 210000),
                    (3, N'SKU-003', N'Gạch block', N'Vật liệu hoàn thiện', 8500),
                    (4, N'SKU-004', N'Sơn ngoại thất', N'Hóa chất', 320000);
                    SET IDENTITY_INSERT [products] OFF;

                    SET IDENTITY_INSERT [orders] ON;
                    INSERT INTO [orders] ([id], [customerId], [warehouseId], [orderDate], [status]) VALUES
                    (1, 1, 1, '2026-01-05T08:00:00', N'PAID'),
                    (2, 2, 2, '2026-01-06T10:15:00', N'SHIPPED'),
                    (3, 3, 3, '2026-01-07T14:20:00', N'PAID'),
                    (4, 4, 1, '2026-01-08T16:00:00', N'PROCESSING');
                    SET IDENTITY_INSERT [orders] OFF;

                    SET IDENTITY_INSERT [order_items] ON;
                    INSERT INTO [order_items] ([id], [orderId], [productId], [quantity], [unitPrice]) VALUES
                    (1, 1, 1, 30, 95000),
                    (2, 1, 3, 200, 8500),
                    (3, 2, 2, 12, 210000),
                    (4, 3, 4, 8, 320000),
                    (5, 4, 1, 15, 95000),

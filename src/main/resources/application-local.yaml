server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/GRAD}
    username: ${SPRING_DATASOURCE_USERNAME:dbadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:dbadmin}
    driver-class-name: org.postgresql.Driver
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: ${SPRING_REDIS_PORT:6379}
    username: ${SPRING_REDIS_USERNAME:dbadmin}
    password: ${SPRING_REDIS_PASSWORD:dbadmin}
    database: ${SPRING_REDIS_DATABASE:0}
    ssl:
      enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  exam-datasource:
    url: ${EXAM_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;encrypt=true;trustServerCertificate=true}
    username: ${EXAM_DATASOURCE_USERNAME:sa}
    password: ${EXAM_DATASOURCE_PASSWORD:YourStrong@Passw0rd}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  application:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite-preview}
    claude:
      api-url: ${CLAUDE_VM_API_URL}
      api-key: ${CLAUDE_VM_API_KEY}
    codex:
      api-url: ${CODEX_VM_API_URL}
      api-key: ${CODEX_VM_API_KEY}
    openai:
      api-url: ${OPENAI_API_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.4}
    security:
      jwt:
        secret-key: ${SPRING_APPLICATION_SECURITY_JWT_SECRET_KEY:}
        expiration: ${SPRING_APPLICATION_SECURITY_JWT_EXPIRATION:3600000}
      refresh-token:
        pepper: ${SECURITY_REFRESH_TOKEN_PEPPER:}
        expiration: ${SPRING_APPLICATION_SECURITY_JWT_REFRESH_EXPIRATION:604800000}
    url: ${SPRING_APPLICATION_URL:http://localhost:3000}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

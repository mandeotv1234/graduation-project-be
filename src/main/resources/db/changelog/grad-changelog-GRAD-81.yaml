databaseChangeLog:
  - changeSet:
      id: "2803260009"
      author: "PhiHo"
      comment: "Remove visible_to_student, ddl_visible_to_student, schema_diagram_visible_to_student, schema_diagram from spec_datasets (always visible to students)"
      changes:
        - dropColumn:
            tableName: spec_datasets
            columnName: visible_to_student
        - dropColumn:
            tableName: specifications
            columnName: ddl_visible_to_student
        - dropColumn:
            tableName: specifications
            columnName: schema_diagram_visible_to_student
  - changeSet:
      id: "2803260011"
      author: "PhiHo"
      comment: "Add schema_json to specifications"
      changes:
        - dropColumn:
            tableName: specifications
            columnName: schema_diagram
        - addColumn:
            tableName: specifications
            columns:
              - column:
                  name: schema_json
                  type: TEXT
  - changeSet:
      id: "2803260013"
      author: "PhiHo"
      comment: "Seed one premium specification with multiple datasets"
      changes:
        - sql:
            splitStatements: false
            stripComments: false
            sql: |
              DO $$
              DECLARE
                v_spec_id BIGINT;
              BEGIN
                SELECT id
                INTO v_spec_id
                FROM specifications
                WHERE name = 'Quản lý bán hàng đa kho (Mẫu xịn)'
                LIMIT 1;

                IF v_spec_id IS NULL THEN
                  INSERT INTO specifications (
                    name,
                    ddl_script,
                    description,
                    created_by,
                    created_at,
                    updated_at,
                    schema_json
                  )
                  VALUES (
                    'Quản lý bán hàng đa kho (Mẫu xịn)',
                    $DDL$
                    CREATE TABLE [customers] (
                      [id] INT IDENTITY(1,1),
                      [fullName] NVARCHAR(255) NOT NULL,
                      [email] NVARCHAR(255) NOT NULL,
                      [city] NVARCHAR(120),
                      PRIMARY KEY ([id])
                    );

                    CREATE TABLE [warehouses] (
                      [id] INT IDENTITY(1,1),
                      [name] NVARCHAR(255) NOT NULL,
                      [region] NVARCHAR(100) NOT NULL,
                      PRIMARY KEY ([id])
                    );

                    CREATE TABLE [products] (
                      [id] INT IDENTITY(1,1),
                      [sku] NVARCHAR(64) NOT NULL,
                      [productName] NVARCHAR(255) NOT NULL,
                      [category] NVARCHAR(120),
                      [unitPrice] DECIMAL(12,2) NOT NULL,
                      PRIMARY KEY ([id])
                    );

                    CREATE TABLE [orders] (
                      [id] INT IDENTITY(1,1),
                      [customerId] INT NOT NULL,
                      [warehouseId] INT NOT NULL,
                      [orderDate] DATETIME2 NOT NULL,
                      [status] NVARCHAR(40) NOT NULL,
                      PRIMARY KEY ([id]),
                      FOREIGN KEY ([customerId]) REFERENCES [customers]([id]),
                      FOREIGN KEY ([warehouseId]) REFERENCES [warehouses]([id])
                    );

                    CREATE TABLE [order_items] (
                      [id] INT IDENTITY(1,1),
                      [orderId] INT NOT NULL,
                      [productId] INT NOT NULL,
                      [quantity] INT NOT NULL,
                      [unitPrice] DECIMAL(12,2) NOT NULL,
                      PRIMARY KEY ([id]),
                      FOREIGN KEY ([orderId]) REFERENCES [orders]([id]),
                      FOREIGN KEY ([productId]) REFERENCES [products]([id])
                    );
                    $DDL$,
                    'Đặc tả quản lý đơn hàng đa kho với dữ liệu test đa dạng để luyện truy vấn JOIN, GROUP BY, doanh thu, tồn kho.',
                    2,
                    CURRENT_TIMESTAMP,
                    CURRENT_TIMESTAMP,
                    '[{"tableName":"customers","columns":[{"columnName":"id","dataType":"INT","autoIncrement":true,"primaryKey":true,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"fullName","dataType":"NVARCHAR(255)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"email","dataType":"NVARCHAR(255)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"city","dataType":"NVARCHAR(120)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true}]},{"tableName":"warehouses","columns":[{"columnName":"id","dataType":"INT","autoIncrement":true,"primaryKey":true,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"name","dataType":"NVARCHAR(255)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"region","dataType":"NVARCHAR(100)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false}]},{"tableName":"products","columns":[{"columnName":"id","dataType":"INT","autoIncrement":true,"primaryKey":true,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"sku","dataType":"NVARCHAR(64)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"productName","dataType":"NVARCHAR(255)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"category","dataType":"NVARCHAR(120)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"unitPrice","dataType":"DECIMAL(12,2)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false}]},{"tableName":"orders","columns":[{"columnName":"id","dataType":"INT","autoIncrement":true,"primaryKey":true,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"customerId","dataType":"INT","primaryKey":false,"foreignKey":true,"referencesTable":"customers","referencesColumn":"id","nullable":false},{"columnName":"warehouseId","dataType":"INT","primaryKey":false,"foreignKey":true,"referencesTable":"warehouses","referencesColumn":"id","nullable":false},{"columnName":"orderDate","dataType":"DATETIME2","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"status","dataType":"NVARCHAR(40)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false}]},{"tableName":"order_items","columns":[{"columnName":"id","dataType":"INT","autoIncrement":true,"primaryKey":true,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"orderId","dataType":"INT","primaryKey":false,"foreignKey":true,"referencesTable":"orders","referencesColumn":"id","nullable":false},{"columnName":"productId","dataType":"INT","primaryKey":false,"foreignKey":true,"referencesTable":"products","referencesColumn":"id","nullable":false},{"columnName":"quantity","dataType":"INT","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"unitPrice","dataType":"DECIMAL(12,2)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false}]}]'
                  )

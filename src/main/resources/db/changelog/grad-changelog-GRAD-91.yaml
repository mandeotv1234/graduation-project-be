aryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true}]},{"tableName":"NhanVien","columns":[{"columnName":"MaNV","dataType":"VARCHAR(10)","primaryKey":true,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"HoTen","dataType":"NVARCHAR(100)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"GioiTinh","dataType":"NVARCHAR(10)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"NgaySinh","dataType":"DATE","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"ChuyenMon","dataType":"NVARCHAR(100)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"DienThoai","dataType":"VARCHAR(20)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"DiaChi","dataType":"NVARCHAR(100)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"Luong","dataType":"DECIMAL(15,2)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"PhongBan","dataType":"VARCHAR(10)","primaryKey":false,"foreignKey":true,"referencesTable":"PhongBan","referencesColumn":"MaPB","nullable":true},{"columnName":"QLCM","dataType":"VARCHAR(10)","primaryKey":false,"foreignKey":true,"referencesTable":"NhanVien","referencesColumn":"MaNV","nullable":true}]},{"tableName":"ChuyenXe","columns":[{"columnName":"MaChuyen","dataType":"VARCHAR(10)","primaryKey":true,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":false},{"columnName":"TuyenXe","dataType":"VARCHAR(10)","primaryKey":false,"foreignKey":true,"referencesTable":"TuyenXe","referencesColumn":"MaTuyen","nullable":true},{"columnName":"MaXe","dataType":"VARCHAR(10)","primaryKey":false,"foreignKey":true,"referencesTable":"Xe","referencesColumn":"MaXe","nullable":true},{"columnName":"BatDau","dataType":"DATETIME","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"KetThuc","dataType":"DATETIME","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true},{"columnName":"GhiChu","dataType":"NVARCHAR(200)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true}]},{"tableName":"PhanCong","columns":[{"columnName":"ChuyenXe","dataType":"VARCHAR(10)","primaryKey":true,"foreignKey":true,"referencesTable":"ChuyenXe","referencesColumn":"MaChuyen","nullable":false},{"columnName":"MaNV","dataType":"VARCHAR(10)","primaryKey":true,"foreignKey":true,"referencesTable":"NhanVien","referencesColumn":"MaNV","nullable":false},{"columnName":"VaiTro","dataType":"NVARCHAR(50)","primaryKey":false,"foreignKey":false,"referencesTable":null,"referencesColumn":null,"nullable":true}]}]';

                -- ====================================================
                -- Step 4: Define exam question content and correct queries
                -- ====================================================

                -- Cau 1 (2.5d): Tim ten phong ban, ho ten truong phong va ho ten QLCM cua tai xe co tong so chuyen khong tre gio cao nhat
                v_q1_content := '<p><strong>Câu 1 (2.5 điểm):</strong> Tìm tên phòng ban, họ tên trưởng phòng và họ tên người quản lý chuyên môn (QLCM) của (các) tài xế có tổng số chuyến không trễ giờ cao nhất.</p><p><em>Gợi ý: Các chuyến trễ giờ sẽ có ghi chú bắt đầu bằng "Trễ".</em></p>';
                v_q1_correct := $SQL$
              SELECT pb.TenPB, tp.HoTen AS TruongPhong, qlcm.HoTen AS QLCM
              FROM NhanVien nv
              JOIN PhanCong pc ON pc.MaNV = nv.MaNV
              JOIN ChuyenXe cx ON cx.MaChuyen = pc.ChuyenXe
              JOIN PhongBan pb ON pb.MaPB = nv.PhongBan
              JOIN NhanVien tp ON tp.MaNV = pb.TruongPhong
              LEFT JOIN NhanVien qlcm ON qlcm.MaNV = nv.QLCM
              WHERE pc.VaiTro = N'Tai xe'
                AND (cx.GhiChu NOT LIKE N'Tre%' OR cx.GhiChu IS NULL)
              GROUP BY nv.MaNV, nv.HoTen, pb.TenPB, tp.HoTen, qlcm.HoTen
              HAVING COUNT(*) = (
                SELECT TOP 1 COUNT(*)
                FROM PhanCong pc2
                JOIN ChuyenXe cx2 ON cx2.MaChuyen = pc2.ChuyenXe
                WHERE pc2.VaiTro = N'Tai xe'
                  AND (cx2.GhiChu NOT LIKE N'Tre%' OR cx2.GhiChu IS NULL)
                GROUP BY pc2.MaNV
                ORDER BY COUNT(*) DESC
              );
                $SQL$;

                -- Cau 2 (2.5d): Cho biet ho ten QLCM va ho ten tai xe da chay tat ca cac tuyen di va den Da Lat
                v_q2_content := '<p><strong>Câu 2 (2.5 điểm):</strong> Cho biết thông tin họ và tên người quản lý chuyên môn và họ tên của tài xế đã chạy tất cả các tuyến đi và đến Đà Lạt.</p>';
                v_q2_correct := $SQL$
              SELECT qlcm.HoTen AS QLCM, nv.HoTen AS TaiXe
              FROM NhanVien nv
              JOIN NhanVien qlcm ON qlcm.MaNV = nv.QLCM
              WHERE NOT EXISTS (
                SELECT tx.MaTuyen
                FROM TuyenXe tx
                WHERE tx.BenDi = N'Da Lat' OR tx.BenDen = N'Da Lat'
                EXCEPT
                SELECT cx.TuyenXe
                FROM PhanCong pc
                JOIN ChuyenXe cx ON cx.MaChuyen = pc.ChuyenXe
                WHERE pc.MaNV = nv.MaNV
                  AND pc.VaiTro = N'Tai xe'
              );
                $SQL$;

                -- Cau 3 (2.5d): Stored Procedure SP_ThemChuyenXe
                v_q3_content := '<p><strong>Câu 3 (2.5 điểm):</strong> Cài đặt stored procedure <code>SP_ThemChuyenXe_MSSV</code> để lên lịch cho chuyến mới, nhận vào mã chuyến, mã tuyến, mã xe, bắt đầu.</p><ul><li>Mã chuyến xe được tạo tự động theo cấu trúc <code>CX###</code>, trong đó ### là số thứ tự gồm 3 chữ số. Số thứ tự này được xác định bằng cách lấy mã chuyến xe có số thứ tự lớn nhất hiện có rồi cộng thêm 1. <em>(Sử dụng function để xác định tự động mã chuyến mới.)</em></li><li>Mã tuyến và mã xe phải tồn tại trong hệ thống.</li><li>Thời gian bắt đầu của chuyến mới phải sau thời gian kết thúc của chuyến sau cùng của xe đó (cùng mã xe) ít nhất 2 giờ.</li></ul><p>Khi các điều kiện thỏa mã thì thêm chuyến xe vào và trả về 1 báo hiệu thành công, ngược lại trả về 0 báo hiệu thất bại kèm in thông báo lỗi.</p>';
                v_q3_correct := $SQL$
              -- Buoc 1: Tao function sinh ma chuyen tu dong
              CREATE FUNCTION FN_SinhMaChuyen()
              RETURNS VARCHAR(10)
              AS
              BEGIN
                DECLARE @MaxNum INT;
                DECLARE @NewMa VARCHAR(10);
                SELECT @MaxNum = MAX(CAST(SUBSTRING(MaChuyen, 3, LEN(MaChuyen) - 2) AS INT))
                FROM ChuyenXe;
                IF @MaxNum IS NULL SET @MaxNum = 0;
                SET @NewMa = 'CX' + RIGHT('000' + CAST(@MaxNum + 1 AS VARCHAR(3)), 3);
                RETURN @NewMa;
              END;
              GO

              -- Buoc 2: Tao stored procedure them chuyen xe
              CREATE PROCEDURE SP_ThemChuyenXe_MSSV
                @MaTuyen VARCHAR(10),
                @MaXe VARCHAR(10),
                @BatDau DATETIME
              AS
              BEGIN
                DECLARE @MaChuyen VARCHAR(10);
                DECLARE @LastKetThuc DATETIME;

                -- Kiem tra ma tuyen ton tai
                IF NOT EXISTS (SELECT 1 FROM TuyenXe WHERE MaTuyen = @MaTuyen)
                BEGIN
                  PRINT N'Loi: Ma tuyen khong ton tai';
                  RETURN 0;
                END

                -- Kiem tra ma xe ton tai
                IF NOT EXISTS (SELECT 1 FROM Xe WHERE MaXe = @MaXe)
                BEGIN
                  PRINT N'Loi: Ma xe khong ton tai';
                  RETURN 0;
                END

                -- Kiem tra thoi gian bat dau phai sau ket thuc chuyen cuoi cung cua xe it nhat 2 gio
                SELECT @LastKetThuc = MAX(KetThuc) FROM ChuyenXe WHERE MaXe = @MaXe;
                IF @LastKetThuc IS NOT NULL AND @BatDau < DATEADD(HOUR, 2, @LastKetThuc)
                BEGIN
                  PRINT N'Loi: Thoi gian bat dau phai sau thoi gian ket thuc chuyen cuoi cung cua xe it nhat 2 gio';
                  RETURN 0;
                END

                -- Sinh ma chuyen tu dong
                SET @MaChuyen = dbo.FN_SinhMaChuyen();

                -- Them chuyen xe
                INSERT INTO ChuyenXe (MaChuyen, TuyenXe, MaXe, BatDau)
                VALUES (@MaChuyen, @MaTuyen, @MaXe, @BatDau);

                RETURN 1;
              END;
                $SQL$;

                -- Cau 4 (2.5d): Stored procedure SP_InTKXe
                v_q4_content := '<p><strong>Câu 4 (2.5 điểm):</strong> Cài đặt stored procedure <code>SP_InTKXe_MSSV</code> nhận vào mã xe và in thông tin xe theo mẫu sau:</p><pre>--- THONG KE XE ---\n--- Xe: &lt;@MaXe&gt; - &lt;@BienSo&gt;\n--- Tong so chuyen: &lt;Tong so chuyen da chay&gt;\n--- So tuyen da chay: &lt;Tong so tuyen da chay&gt;\n--- Tong so chuyen chua chay: &lt;Tong so chuyen chua chay&gt;</pre><p><em>Lưu ý: Trạng thái đã chạy/chưa chạy dựa vào so sánh thời gian bắt đầu của chuyến và thời gian hiện tại.</em></p>';
                v_q4_correct := $SQL$
              CREATE PROCEDURE SP_InTKXe_MSSV
                @MaXe VARCHAR(10)
              AS
              BEGIN
                DECLARE @BienSo VARCHAR(20);
                DECLARE @TongChuyen INT;
                DECLARE @SoTuyen INT;
                DECLARE @ChuaChay INT;

                -- Lay bien so xe
                SELECT @BienSo = BienSo FROM Xe WHERE MaXe = @MaXe;

                IF @BienSo IS NULL
                BEGIN
                  PRINT N'Ma xe khong ton tai';
                  RETURN;
                END

                -- Tong so chuyen da chay (bat dau < thoi gian hien tai)
                SELECT @TongChuyen = COUNT(*)
                FROM ChuyenXe
                WHERE MaXe = @MaXe AND BatDau < GETDATE();

                -- So tuyen da chay
                SELECT @SoTuyen = COUNT(DISTINCT TuyenXe)
                FROM ChuyenXe
                WHERE MaXe = @MaXe AND BatDau < GETDATE();

                -- Tong so chuyen chua chay (bat dau >= thoi gian hien tai)
                SELECT @ChuaChay = COUNT(*)
                FROM ChuyenXe
                WHERE MaXe = @MaXe AND BatDau >= GETDATE();

                PRINT '--- THONG KE XE ---';
                PRINT '--- Xe: ' + @MaXe + ' - ' + @BienSo;
                PRINT '--- Tong so chuyen: ' + CAST(@TongChuyen AS VARCHAR(10));
                PRINT '--- So tuyen da chay: ' + CAST(@SoTuyen AS VARCHAR(10));
                PRINT '--- Tong so chuyen chua chay: ' + CAST(@ChuaChay AS VARCHAR(10));
              END;
                $SQL$;

                -- ====================================================
                -- Step 5: Insert specification
                -- ====================================================
                SELECT id INTO v_creator_id
                FROM users
                WHERE role = 'TEACHER'
                ORDER BY id
                LIMIT 1;

                IF v_creator_id IS NULL THEN
                  SELECT id INTO v_creator_id
                  FROM users ORDER BY id LIMIT 1;
                END IF;

                INSERT INTO specifications (name, ddl_script, description, created_by, created_at, updated_at, schema_json)
                VALUES (
                  'Quan Ly Nha Xe (QLNHAXE)',
                  v_ddl_script,
                  'Co so du lieu quan ly nha xe khach, bao gom cac tuyen xe, xe, chuyen xe, phong ban, nhan vien va phan cong.',
                  v_creator_id,
                  CURRENT_TIMESTAMP,
                  CURRENT_TIMESTAMP,

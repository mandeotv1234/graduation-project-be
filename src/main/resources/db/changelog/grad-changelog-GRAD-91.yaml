                -- ChuyenXe attributes
                INSERT INTO spec_attributes (entity_id, attribute_name, data_type, description, is_primary_key, is_nullable, order_index)
                VALUES
                (v_entity_chuyenxe_id, 'MaChuyen', 'VARCHAR(10)', 'Ma chuyen xe', TRUE, FALSE, 1),
                (v_entity_chuyenxe_id, 'TuyenXe', 'VARCHAR(10)', 'Ma tuyen xe (FK -> TuyenXe.MaTuyen)', FALSE, TRUE, 2),

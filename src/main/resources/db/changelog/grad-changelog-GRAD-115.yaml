databaseChangeLog:
  - changeSet:
      id: "3003260001"
      author: system
      comment: "T04/T15: Add fields to test_cases for SP/Function/Trigger verification (case_name, setup_script, invocation_query, verification_type, input_parameters, match_type)"
      changes:
        - addColumn:
            tableName: test_cases
            columns:
              - column:
                  name: case_name
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: setup_script
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: invocation_query
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: verification_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: true
              - column:
                  name: input_parameters
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: match_type
                  type: VARCHAR(16)
                  defaultValue: EXACT
                  constraints:
                    nullable: true

  - changeSet:
      id: "3003260002"
      author: system
      comment: "T04/T15: Backfill match_type for existing test_cases rows"
      changes:
        - sql:
            sql: UPDATE test_cases SET match_type = 'EXACT' WHERE match_type IS NULL

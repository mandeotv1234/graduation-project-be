name: CD - Backend Deploy

on:
  push:
    branches:
      - develop
      - feature/GRAD-215-Improve-scale-grading-exam

env:
  REGISTRY: registry.digitalocean.com/graduation
  IMAGE_NAME: backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build Spring Boot jar
        run: ./gradlew clean bootJar --no-daemon

      - name: Login DO Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DO_REGISTRY_TOKEN }}
          password: ${{ secrets.DO_REGISTRY_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:latest .

      - name: Push Image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/app
            echo "${{ secrets.DO_REGISTRY_TOKEN }}" | docker login registry.digitalocean.com -u "${{ secrets.DO_REGISTRY_TOKEN }}" --password-stdin
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            $DC pull backend
            $DC rm -f backend
            $DC up -d --no-deps backend
            $DC ps

      - name: Deploy worker to Droplet VM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WORKER_SERVER_HOST }}
          username: root
          key: ${{ secrets.WORKER_SERVER_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/root/app
            ENV_FILE="$APP_DIR/.env.worker"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -f "$ENV_FILE" ]; then
              echo "Missing $ENV_FILE on VM2. Create worker-only env file before deploying." >&2
              exit 1
            fi

            echo "${{ secrets.DO_REGISTRY_TOKEN }}" | docker login registry.digitalocean.com -u "${{ secrets.DO_REGISTRY_TOKEN }}" --password-stdin
            docker pull "$IMAGE"

            docker rm -f backend-worker >/dev/null 2>&1 || true
            docker run -d \
              --name backend-worker \
              --restart always \
              --env-file "$ENV_FILE" \
              -p 127.0.0.1:8080:8080 \
              -v backend_worker_uploads:/app/data \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE"

            docker ps --filter "name=backend-worker"
            docker logs --tail 80 backend-worker
